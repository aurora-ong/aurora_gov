apiVersion: v1
kind: Service
metadata:
  name: {{ include "aurora-gov.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurora-gov.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    {{- include "aurora-gov.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.app.port | default 4000 }}
