{{- $hooks := list -}}
{{- if .Values.dbReset.onCreate -}}
  {{- $hooks = append $hooks "post-install" -}}
{{- end -}}
{{- if .Values.dbReset.onUpgrade -}}
  {{- $hooks = append $hooks "pre-upgrade" -}}
{{- end -}}
{{- if and .Values.dbReset.enabled (gt (len $hooks) 0) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aurora-gov.fullname" . }}-db-reset-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aurora-gov.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-reset-job
  annotations:
    "helm.sh/hook": {{ join "," $hooks | quote }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "aurora-gov.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-reset-job
    spec:
      restartPolicy: Never
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h {{ include "aurora-gov.fullname" . }}-database -p {{ .Values.database.port | default 5432 }} -U {{ .Values.database.user }}; do
                echo "Esperando que PostgreSQL esté listo..."
                sleep 2
              done
        - name: terminate-db-connections
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              export PGPASSWORD="{{ .Values.database.password }}"
              echo "Cerrando conexiones activas y bloqueando nuevas conexiones a las bases de datos..."
              psql -h {{ include "aurora-gov.fullname" . }}-database -p {{ .Values.database.port | default 5432 }} -U {{ .Values.database.user }} -d postgres -c \
                "ALTER DATABASE \"{{ .Values.database.projectorDb }}\" WITH ALLOW_CONNECTIONS false;" 2>/dev/null || true
              psql -h {{ include "aurora-gov.fullname" . }}-database -p {{ .Values.database.port | default 5432 }} -U {{ .Values.database.user }} -d postgres -c \
                "ALTER DATABASE \"{{ .Values.database.eventstoreDb }}\" WITH ALLOW_CONNECTIONS false;" 2>/dev/null || true
              psql -h {{ include "aurora-gov.fullname" . }}-database -p {{ .Values.database.port | default 5432 }} -U {{ .Values.database.user }} -d postgres -c \
                "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname IN ('{{ .Values.database.projectorDb }}', '{{ .Values.database.eventstoreDb }}') AND pid <> pg_backend_pid();" || true
              echo "Conexiones terminadas exitosamente."
      containers:
        - name: db-reset
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /app/bin/aurora_gov_web
            - eval
            - "AuroraGov.Release.db_reset"
          resources:
            {{- toYaml .Values.dbReset.resources | nindent 12 }}
          env:
            - name: PHX_SERVER
              value: "false"
            - name: PHX_HOST
              value: {{ .Values.ingress.host | quote }}
            - name: SECRET_KEY_BASE
              value: {{ .Values.app.secretKeyBase | quote }}
            - name: PROJECTOR_DATABASE_URL
              value: {{ printf "ecto://%s:%s@%s-database:%v/%s" .Values.database.user .Values.database.password (include "aurora-gov.fullname" .) .Values.database.port .Values.database.projectorDb | quote }}
            - name: EVENTSTORE_DATABASE_URL
              value: {{ printf "ecto://%s:%s@%s-database:%v/%s" .Values.database.user .Values.database.password (include "aurora-gov.fullname" .) .Values.database.port .Values.database.eventstoreDb | quote }}
{{- end }}
