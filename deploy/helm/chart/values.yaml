# Default values for aurora-gov.

# Application image configuration
image:
  repository: registry.weychafe.nicher.cl/aurora_gov
  tag: "latest"
  pullPolicy: IfNotPresent
  imagePullSecrets: []

# Ingress & domain configuration
ingress:
  enabled: true
  className: public
  host: gov.aurora.ong
  path: /
  pathType: Prefix
  clusterIssuer: weychafe-letsencrypt
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  tls:
    enabled: true
    secretName: ""  # If empty, defaults to {{ fullname }}-tls

# Web application runtime configuration
app:
  secretKeyBase: ""  # Passed via --set or install script
  phxServer: "true"
  port: 4000
  replicas: 1
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
      ephemeral-storage: "100Mi"
    limits: {}

# Persistent Volume for uploads (/uploads/)
uploads:
  mountPath: /uploads
  persistence:
    enabled: true
    # Si createPV es true, crea un PersistentVolume hostPath dedicado y aislado para esta instancia.
    # Si createPV es false, el PVC utilizará aprovisionamiento dinámico (ej: microk8s-hostpath).
    createPV: true
    size: 10Gi
    accessMode: ReadWriteMany
    storageClass: ""  # Si se deja vacío, genera {{ .Release.Namespace }}-{{ fullname }}-uploads-hostpath
    hostPath: ""      # Si se deja vacío, genera /opt/aurora-gov/{{ .Release.Namespace }}/uploads

# Embedded PostgreSQL Database configuration
database:
  enabled: true
  image:
    repository: postgres
    tag: latest
    pullPolicy: IfNotPresent
  user: postgres
  password: "password"
  port: 5432
  projectorDb: aurora_gov_projector
  eventstoreDb: aurora_gov_eventstore
  resources:
    requests:
      cpu: "150m"
      memory: "512Mi"
      ephemeral-storage: "100Mi"
  persistence:
    enabled: true
    # Si createPV es true, crea un PersistentVolume hostPath dedicado y aislado para esta instancia.
    # Si createPV es false, el PVC utilizará aprovisionamiento dinámico (ej: microk8s-hostpath).
    createPV: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""  # Si se deja vacío, genera {{ .Release.Namespace }}-{{ fullname }}-database-hostpath
    hostPath: ""      # Si se deja vacío, genera /opt/aurora-gov/{{ .Release.Namespace }}/postgres

# Automatic Database Creation & Migration Job
# Runs AuroraGov.Release.db_create and db_migrate automatically (idempotent)
migration:
  enabled: true
  onCreate: true   # Ejecutar al crear / instalar (hook: post-install)
  onUpgrade: true  # Ejecutar al actualizar (hook: post-upgrade)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
      ephemeral-storage: "100Mi"

# Optional Seed Job
# Triggered when seed.enabled is true or seed.name is set (e.g. "seeds.exs" or "seeds")
seed:
  enabled: false
  name: ""         # e.g., "seeds.exs"
  onCreate: true   # Si enabled/name está activo, ejecutar en instalación (hook: post-install)
  onUpgrade: false # Si enabled/name está activo, ejecutar en actualización (hook: post-upgrade)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
      ephemeral-storage: "100Mi"

# Optional DB Reset Job (drops, creates, migrates)
# Allows wiping and recreating the database cleanly.
dbReset:
  enabled: false
  onCreate: true   # Si enabled es true, ejecutar en instalación (hook: post-install)
  onUpgrade: false # Si enabled es true, ejecutar en actualización (hook: pre-upgrade)
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
      ephemeral-storage: "100Mi"
